<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Редактирование</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        .header { background: #2196F3; color: white; padding: 15px; display: flex; align-items: center; }
        .back-btn { font-size: 24px; cursor: pointer; margin-right: 15px; }
        
        .container { padding: 15px; }
        
        .btn-photo { background: #FFA000; color: white; border: none; padding: 12px; border-radius: 20px; width: 220px; font-weight: bold; margin-bottom: 5px; cursor: pointer; }
        .photo-count { font-size: 12px; color: #666; margin-bottom: 15px; }
        
        /* Контейнер для превью фото */
        .photo-preview { width: 100%; background: #eee; min-height: 100px; padding: 10px; display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; }
        .img-item { width: 80px; height: 80px; position: relative; flex-shrink: 0; }
        .img-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
        .img-item .del { position: absolute; top: 0; right: 0; background: rgba(0,0,0,0.6); color: white; width: 20px; height: 20px; text-align: center; font-size: 14px; cursor: pointer; }

        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 15px; box-sizing: border-box; font-size: 16px; outline: none; }
        textarea { height: 120px; resize: none; }

        .btn-save { background: #4CAF50; color: white; border: none; padding: 15px; border-radius: 30px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .btn-delete { background: #F44336; color: white; border: none; padding: 15px; border-radius: 30px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <span class="back-btn" onclick="history.back()">←</span>
        <h1 id="pageTitle" style="font-size: 18px; margin: 0;">Редактирование</h1>
    </div>

    <div class="container">
        <button class="btn-photo" onclick="document.getElementById('fileInput').click()">Добавить фото (макс 5)</button>
        <div class="photo-count" id="countText">Выбрано: 0 из 5</div>
        <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleFiles(this.files)">
        
        <div class="photo-preview" id="preview"></div>

        <input type="text" id="inTitle" placeholder="Название">
        <input type="number" id="inPrice" placeholder="Цена">
        <input type="text" id="inPhone" placeholder="Телефон">
        <textarea id="inDesc" placeholder="Описание"></textarea>

        <button class="btn-save" onclick="saveAd()">Сохранить</button>
        <button id="delBtn" class="btn-delete" style="display:none" onclick="deleteAd()">Удалить объявление</button>
    </div>

    <script>
        const firebaseConfig = { /* Твой конфиг */ };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('editId');
        let currentPhotos = [];

        if (editId) {
            document.getElementById('delBtn').style.display = 'block';
            database.ref('Ads/' + editId).once('value').then(snap => {
                const ad = snap.val();
                document.getElementById('inTitle').value = ad.title;
                document.getElementById('inPrice').value = ad.price;
                document.getElementById('inPhone').value = ad.phone;
                document.getElementById('inDesc').value = ad.description;
                currentPhotos = ad.imageUrls || [];
                renderPhotos();
            });
        }

        function handleFiles(files) {
            for (let file of files) {
                if (currentPhotos.length >= 5) break;
                const reader = new FileReader();
                reader.onload = (e) => {
                    // Убираем заголовок data:image/jpeg;base64, для базы
                    const base64 = e.target.result.split(',')[1];
                    currentPhotos.push(base64);
                    renderPhotos();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderPhotos() {
            const preview = document.getElementById('preview');
            preview.innerHTML = '';
            currentPhotos.forEach((img, idx) => {
                preview.innerHTML += `
                    <div class="img-item">
                        <img src="data:image/jpeg;base64,${img}">
                        <div class="del" onclick="removePhoto(${idx})">×</div>
                    </div>`;
            });
            document.getElementById('countText').innerText = `Выбрано: ${currentPhotos.length} из 5`;
        }

        function removePhoto(idx) {
            currentPhotos.splice(idx, 1);
            renderPhotos();
        }

        function saveAd() {
            const data = {
                title: document.getElementById('inTitle').value,
                price: document.getElementById('inPrice').value,
                phone: document.getElementById('inPhone').value,
                description: document.getElementById('inDesc').value,
                imageUrls: currentPhotos,
                author: localStorage.getItem("USER_NAME"),
                timestamp: Date.now()
            };
            
            const ref = editId ? database.ref('Ads/' + editId) : database.ref('Ads').push();
            ref.update(data).then(() => {
                alert("Сохранено!");
                location.href = 'board.html';
            });
        }

        function deleteAd() {
            if (confirm("Удалить объявление навсегда?")) {
                database.ref('Ads/' + editId).remove().then(() => {
                    location.href = 'board.html';
                });
            }
        }
    </script>
</body>
</html>
