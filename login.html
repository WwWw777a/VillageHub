<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VillageHub</title>
    
    <link rel="manifest" href="manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VillageHub">
    <link rel="apple-touch-icon" href="icon.png">

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --accent-blue: #2196F3;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f5f5f5; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 30px 20px; 
            margin: 0; 
            padding-top: max(30px, env(safe-area-inset-top));
            overflow: hidden;
            position: fixed;
            width: 100vw;
            height: 100dvh;
            -webkit-text-size-adjust: 100%;
        }

        /* СТИЛИ УВЕДОМЛЕНИЯ (КАК НА ГЛАВНОЙ) */
        #broadcast_overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0,0,0,0.7); display: none; z-index: 100000;
            align-items: center; justify-content: center; padding: 20px;
        }
        .broadcast-card {
            background: white; border-radius: 24px; padding: 24px; 
            width: 100%; max-width: 400px;
            max-height: 85vh; display: flex; flex-direction: column;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease-out; box-sizing: border-box;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .broadcast-card i { font-size: 40px; display: block; margin-bottom: 12px; font-style: normal; flex-shrink: 0; }
        .broadcast-card h2 { margin: 0 0 12px 0; font-size: 20px; color: #333; flex-shrink: 0; }
        #broadcast_text { 
            font-size: 16px; color: #555; line-height: 1.5; margin-bottom: 20px; 
            white-space: pre-wrap; word-wrap: break-word; overflow-y: auto;
            text-align: left; padding-right: 5px; -webkit-overflow-scrolling: touch;
        }
        .broadcast-btn {
            background: var(--accent-blue); color: white; border: none; padding: 14px;
            border-radius: 30px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; flex-shrink: 0;
        }
        
        .map-icon { width: 250px; height: auto; margin-bottom: 15px; }
        .subtitle { color: #666; margin-bottom: 25px; font-size: 18px; font-weight: bold; }
        .input-group { width: 100%; max-width: 350px; margin-bottom: 15px; position: relative; }
        input { width: 100%; padding: 16px; border: 1.5px solid #8e8e8e; border-radius: 12px; background-color: #f5f5f5; font-size: 16px; box-sizing: border-box; color: #333; outline: none; }
        
        .password-toggle {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            font-size: 20px; cursor: pointer; color: #757575; user-select: none; z-index: 10;
        }

        .btn-login { width: 100%; max-width: 350px; background-color: #1e7ad3; color: white; border: none; border-radius: 30px; padding: 16px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .policy-text { font-size: 12px; color: #666; text-align: center; margin-top: 20px; line-height: 1.4; }
        .forgot-pass { color: #1e7ad3; text-decoration: none; font-size: 15px; font-weight: bold; margin-top: 25px; cursor: pointer; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center; }
        .modal-card { background: white; width: 85%; max-width: 320px; padding: 25px; border-radius: 2px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-card h3 { margin: 0 0 25px 0; font-size: 18px; color: #000; }
        .modal-input { width: 100%; border: none; border-bottom: 1.5px solid #757575; padding: 10px 0; margin-bottom: 20px; font-size: 16px; outline: none; background: transparent; border-radius: 0; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 25px; margin-top: 10px; }
        .modal-btn { background: none; border: none; color: #5c6bc0; font-weight: bold; font-size: 14px; cursor: pointer; }

        #geoHint { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; }
        .hint-card { background: white; width: 80%; max-width: 300px; padding: 20px; border-radius: 15px; text-align: center; }
        .hint-card p { font-size: 15px; color: #333; line-height: 1.5; margin-bottom: 20px; }
        .hint-btn { background: #1e7ad3; color: white; border: none; padding: 12px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="broadcast_overlay">
        <div class="broadcast-card">
            <i>📢</i>
            <h2>Объявление</h2>
            <div id="broadcast_text"></div>
            <button class="broadcast-btn" onclick="closeBroadcast()">ПОНЯТНО</button>
        </div>
    </div>

    <img src="logo.png" class="map-icon" alt="logo">
    
    <p class="subtitle">Регистрация / Вход</p>

    <div class="input-group"><input type="text" id="name" placeholder="Ваше Имя"></div>
    <div class="input-group"><input type="text" id="phone" placeholder="9..." value="+7"></div>
    <div class="input-group"><input type="text" id="secret" placeholder="Секретное слово (для восстановления)"></div>
    <div class="input-group">
        <input type="password" id="password" placeholder="Пароль">
        <span class="password-toggle" onclick="togglePass('password', this)">👁️</span>
    </div>

    <button class="btn-login" id="mainLoginBtn">Регистрация / Вход</button>

    <div class="policy-text">
        Нажимая кнопку, вы принимаете <br>
        <a href="https://disk.yandex.ru/i/rrD6Mhbe3IEf0Q" target="_blank" style="color:#666; text-decoration: none;">Политику конфиденциальности</a>
    </div>

    <div class="forgot-pass" onclick="openResetModal()">Забыли пароль?</div>

    <div id="geoHint">
        <div class="hint-card">
            <p>📍 <b>Проверка доступа</b><br><br>Для входа необходимо подтвердить, что вы находитесь на территории поселка.</p>
            <button class="hint-btn" onclick="startGeoCheck()">Понятно</button>
        </div>
    </div>

    <div id="resetModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Восстановление пароля</h3>
            <input type="text" id="resetPhone" class="modal-input" placeholder="Введите номер телефона">
            <input type="text" id="resetSecret" class="modal-input" placeholder="Ваше кодовое слово">
            <div style="position: relative;">
                <input type="password" id="resetPass" class="modal-input" placeholder="Новый пароль">
                <span class="password-toggle" onclick="togglePass('resetPass', this)" style="bottom: 35px; transform: none;">👁️</span>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn" onclick="closeResetModal()">Отмена</button>
                <button class="modal-btn" id="confirmResetBtn">Сменить</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyByW29mBVBcj_WIC_KbeNR86ocBTaELZ3Y",
            authDomain: "villagehub-d4d5e.firebaseapp.com",
            databaseURL: "https://villagehub-d4d5e-default-rtdb.firebaseio.com",
            projectId: "villagehub-d4d5e",
            storageBucket: "villagehub-d4d5e.firebasestorage.app",
            messagingSenderId: "131056250064",
            appId: "1:131056250064:web:84c0c67819e9828ec642d5",
            measurementId: "G-N0C383JQWP"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- ЛОГИКА ЗВУКА И РАЗБЛОКИРОВКИ IOS ---
        let isAudioUnlocked = false;
        const alertAudio = new Audio('alert.mp3');
        alertAudio.preload = 'auto';

        function unlockAudio() {
            if (isAudioUnlocked) return;
            const silentAudio = new Audio('alert.mp3');
            silentAudio.muted = true;
            silentAudio.play().then(() => { silentAudio.pause(); isAudioUnlocked = true; }).catch(() => {});
            document.removeEventListener('click', unlockAudio);
            document.removeEventListener('touchstart', unlockAudio);
        }
        document.addEventListener('click', unlockAudio);
        document.addEventListener('touchstart', unlockAudio);

        function playAlertSound() {
            if ('mediaSession' in navigator) { navigator.mediaSession.playbackState = 'none'; }
            alertAudio.play().then(() => {
                alertAudio.onended = () => { alertAudio.pause(); alertAudio.currentTime = 0; };
            }).catch(() => {});
        }

        // --- СЛУШАТЕЛЬ РАССЫЛКИ ---
        database.ref('SystemAlerts').on('value', (snap) => {
            const alertData = snap.val();
            if (alertData && alertData.text) {
                const lastSeenTime = localStorage.getItem("LAST_ALERT_TIME") || "0";
                if (alertData.time && alertData.time.toString() !== lastSeenTime) {
                    if (!isAudioUnlocked) {
                        const playOnce = () => { playAlertSound(); document.removeEventListener('click', playOnce); };
                        document.addEventListener('click', playOnce);
                    } else { playAlertSound(); }
                    document.getElementById('broadcast_text').innerText = alertData.text;
                    document.getElementById('broadcast_overlay').style.display = 'flex';
                }
            }
        });

        function closeBroadcast() {
            database.ref('SystemAlerts/time').once('value').then((snap) => {
                const currentTime = snap.val();
                if (currentTime) { localStorage.setItem("LAST_ALERT_TIME", currentTime.toString()); }
                document.getElementById('broadcast_overlay').style.display = 'none';
            });
        }

        // --- ЛОГИКА ВХОДА ---
        function togglePass(inputId, el) {
            const input = document.getElementById(inputId);
            if (input.type === "password") { input.type = "text"; el.innerText = "🔒"; } 
            else { input.type = "password"; el.innerText = "👁️"; }
        }

        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function() {
            if (!this.value.startsWith('+7')) { this.value = '+7'; }
            let val = this.value.substring(2).replace(/\D/g, '');
            this.value = '+7' + val;
        });

        const VILLAGE_LAT = 44.841121;
        const VILLAGE_LON = 37.655546;
        const ALLOWED_RADIUS_M = 15000;
        let tempUserData = null;

        function formatPhoneNumber(input) {
            let clean = input.replace(/[^0-9+]/g, "");
            if (clean.startsWith("8")) clean = "+7" + clean.substring(1);
            else if (clean.startsWith("9")) clean = "+7" + clean;
            return clean;
        }

        function hashString(input) { return CryptoJS.SHA256(input).toString(); }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        document.getElementById('mainLoginBtn').onclick = function() {
            const name = document.getElementById('name').value.trim();
            const phone = formatPhoneNumber(document.getElementById('phone').value.trim());
            const password = document.getElementById('password').value.trim();
            const secret = document.getElementById('secret').value.trim();

            if (!name || phone.length < 10 || password.length < 6 || !secret) {
                alert("Проверьте поля!"); return;
            }
            tempUserData = { name, phone, password, secret };
            database.ref('AppSettings/gpsEnabled').once('value').then((snap) => {
                if (snap.val() !== false) { document.getElementById('geoHint').style.display = 'flex'; } 
                else { checkBanAndLogin(tempUserData.name, tempUserData.phone, tempUserData.password, tempUserData.secret); }
            });
        };

        function startGeoCheck() {
            document.getElementById('geoHint').style.display = 'none';
            navigator.geolocation.getCurrentPosition((pos) => {
                const dist = getDistance(pos.coords.latitude, pos.coords.longitude, VILLAGE_LAT, VILLAGE_LON);
                if (dist <= ALLOWED_RADIUS_M) checkBanAndLogin(tempUserData.name, tempUserData.phone, tempUserData.password, tempUserData.secret);
                else alert("Вы слишком далеко от поселка!");
            }, () => alert("Для работы приложения разрешите доступ к GPS."));
        }

        function checkBanAndLogin(name, phone, password, secret) {
            database.ref('BannedUsers/' + phone).once('value').then((snap) => {
                if (snap.exists()) alert("ДОСТУП ЗАПРЕЩЕН ⛔");
                else processDatabaseAuth(name, phone, password, secret);
            });
        }

        function processDatabaseAuth(name, phone, password, secret) {
            const passHash = hashString(password);
            const secretHash = hashString(secret);
            const userRef = database.ref('Users/' + phone);
            userRef.once('value').then((snap) => {
                if (snap.exists()) {
                    if (snap.val().password === passHash) saveLocal(snap.val().name || name, phone, snap.val().role || "Житель");
                    else alert("Неверный пароль!");
                } else {
                    userRef.set({ name, password: passHash, secretWord: secretHash, role: "Житель", regDate: Date.now() })
                    .then(() => saveLocal(name, phone, "Житель"));
                }
            });
        }

        document.getElementById('confirmResetBtn').onclick = function() {
            const phone = formatPhoneNumber(document.getElementById('resetPhone').value.trim());
            const secret = document.getElementById('resetSecret').value.trim();
            const newPass = document.getElementById('resetPass').value.trim();
            if (!phone || !secret || newPass.length < 6) { alert("Заполните все поля"); return; }
            const secretHash = hashString(secret);
            const newPassHash = hashString(newPass);
            database.ref('Users/' + phone).once('value').then(snap => {
                if (snap.exists() && snap.val().secretWord === secretHash) {
                    database.ref('Users/' + phone + '/password').set(newPassHash).then(() => { alert("Пароль изменен!"); closeResetModal(); });
                } else { alert("Данные неверны!"); }
            });
        };

        function saveLocal(name, phone, role) {
            localStorage.setItem("USER_PHONE", phone);
            localStorage.setItem("USER_NAME", name);
            localStorage.setItem("USER_ROLE", role);
            location.href = "index.html";
        }

        function openResetModal() { document.getElementById('resetModal').style.display = 'flex'; }
        function closeResetModal() { document.getElementById('resetModal').style.display = 'none'; }
        
        document.addEventListener('touchmove', function(e) {
            if (document.getElementById('broadcast_overlay').style.display === 'flex') { e.preventDefault(); }
        }, { passive: false });
    </script>
</body>
</html>
