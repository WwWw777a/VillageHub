<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вход в VillageHub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            margin: 0;
            user-select: none;
        }

        .map-icon { font-size: 70px; margin-bottom: 10px; }
        h2 { margin: 0; color: #333; font-size: 24px; text-align: center; }
        .subtitle { color: #666; margin-bottom: 25px; font-size: 14px; text-align: center; }

        .input-group {
            width: 100%;
            max-width: 350px;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
            font-size: 16px;
            box-sizing: border-box;
            color: #333;
            outline: none;
        }

        input:focus { border-color: #1976D2; }

        .btn-login {
            width: 100%;
            max-width: 350px;
            background-color: #1976D2;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-login:active { background-color: #1565C0; transform: scale(0.98); }

        .forgot-pass {
            color: #1976D2;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            display: block;
            text-align: center;
        }

        .policy-container {
            font-size: 11px;
            color: #888;
            text-align: center;
            margin-top: 30px;
            max-width: 280px;
            line-height: 1.4;
        }

        .policy-link {
            color: #1976D2;
            text-decoration: underline;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="map-icon">🗺️</div>
    <h2>Наш поселок</h2>
    <p class="subtitle">Регистрация / Вход</p>

    <div class="input-group"><input type="text" id="name" placeholder="Ваше Имя"></div>
    <div class="input-group"><input type="text" id="phone" placeholder="Телефон" value="+7"></div>
    <div class="input-group"><input type="text" id="secret" placeholder="Секретное слово (для восстановления)"></div>
    <div class="input-group"><input type="password" id="password" placeholder="Пароль"></div>

    <button class="btn-login" onclick="handleLogin()">Регистрация / Вход</button>

    <a href="#" class="forgot-pass" onclick="alert('Восстановление через секретное слово будет доступно после подключения базы данных')">Забыли пароль?</a>

    <div class="policy-container">
        Нажимая кнопку, вы принимаете <br>
        <a href="https://disk.yandex.ru/i/6v_1fV9B6_NfSg" target="_blank" class="policy-link">Политику конфиденциальности</a>
    </div>

    <script>
        function handleLogin() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            
            if (name.length < 2 || phone.length < 10) {
                alert("Пожалуйста, заполните все поля");
                return;
            }

            // Имитация сохранения в SharedPreferences
            localStorage.setItem("USER_NAME", name);
            localStorage.setItem("USER_PHONE", phone);
            
            // Переход на главную
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
