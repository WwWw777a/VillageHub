<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вход в VillageHub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #e9e9e9; /* Чуть темнее фон для контраста с модалкой */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            margin: 0;
        }

        .map-icon { font-size: 80px; margin-bottom: 10px; opacity: 0.8; }
        h2 { margin: 0; color: #333; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 25px; font-size: 14px; }

        .input-group { width: 100%; max-width: 350px; margin-bottom: 12px; }

        /* Стиль основных полей */
        .main-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #999;
            border-radius: 10px;
            background-color: #f9f9f9;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .btn-login {
            width: 100%;
            max-width: 350px;
            background-color: #1976D2;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .forgot-pass {
            color: #1976D2;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        /* МОДАЛЬНОЕ ОКНО (ВОССТАНОВЛЕНИЕ) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: white;
            width: 90%;
            max-width: 320px;
            padding: 24px;
            border-radius: 4px; /* Квадратные углы как на скрине */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-card h3 { margin: 0 0 20px 0; font-size: 18px; color: #333; }

        /* Поля ввода в модалке (только нижняя линия) */
        .modal-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #999;
            padding: 10px 0;
            margin-bottom: 15px;
            font-size: 15px;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-top: 10px;
        }

        .modal-btn {
            background: none;
            border: none;
            color: #5c6bc0;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .policy-container {
            font-size: 11px;
            color: #888;
            text-align: center;
            margin-top: 30px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="map-icon">🗺️</div>
    <h2>Наш поселок</h2>
    <p class="subtitle">Регистрация / Вход</p>

    <div class="input-group"><input type="text" id="name" class="main-input" placeholder="Ваше Имя"></div>
    <div class="input-group"><input type="text" id="phone" class="main-input" placeholder="Телефон" value="+7"></div>
    <div class="input-group"><input type="text" id="secret" class="main-input" placeholder="Секретное слово"></div>
    <div class="input-group"><input type="password" id="password" class="main-input" placeholder="Пароль"></div>

    <button class="btn-login" onclick="handleLogin()">Регистрация / Вход</button>

    <div class="policy-container">
        Нажимая кнопку, вы принимаете <br>
        <a href="https://disk.yandex.ru/i/6v_1fV9B6_NfSg" target="_blank" style="color:#1976D2">Политику конфиденциальности</a>
    </div>

    <div class="forgot-pass" onclick="openResetModal()">Забыли пароль?</div>

    <div id="resetModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Восстановление пароля</h3>
            <input type="text" class="modal-input" placeholder="Введите номер телефона">
            <input type="text" class="modal-input" placeholder="Ваше кодовое слово">
            <input type="password" class="modal-input" placeholder="Новый пароль">
            
            <div class="modal-buttons">
                <button class="modal-btn" onclick="closeResetModal()">Отмена</button>
                <button class="modal-btn" onclick="processReset()">Сменить</button>
            </div>
        </div>
    </div>

    <script>
        function openResetModal() { document.getElementById('resetModal').style.display = 'flex'; }
        function closeResetModal() { document.getElementById('resetModal').style.display = 'none'; }

        function processReset() {
            alert("Запрос отправлен! После подключения Firebase пароль будет обновлен в базе.");
            closeResetModal();
        }

        function handleLogin() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            if (name.length < 2 || phone.length < 10) {
                alert("Заполните поля корректно");
                return;
            }
            localStorage.setItem("USER_NAME", name);
            localStorage.setItem("USER_PHONE", phone);
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
